services:
  frontend:
    image: nginx:1.27-alpine
    container_name: booking-frontend
    ports:
      - "3000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped