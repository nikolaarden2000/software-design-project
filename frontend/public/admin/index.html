<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Админ-панель — Своя Бронь</title>

  <link rel="stylesheet" href="/home/topbar.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
  <header class="topbar">
    <div class="topbar__left">
      <a href="/" class="brand">Своя Бронь</a>
    </div>

    <div class="topbar__center">
      <span class="page-title">Панель администратора</span>
    </div>

    <div class="topbar__right">
      <button id="logoutBtn" class="auth-btn">Выйти</button>
    </div>
  </header>

  <main class="admin-container">
    <section id="accessDenied" class="access-denied hidden">
      <h2>Доступ запрещён</h2>
      <p>Эта страница доступна только администраторам локаций.</p>
      <a href="/" class="btn">На главную</a>
    </section>

    <section id="adminContent" class="hidden">
      <div id="adminRoot"></div>
    </section>
  </main>

  <script src="/shared/api.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
