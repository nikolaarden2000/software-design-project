name: E2E tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  e2e_tests:
    name: Run Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_PROJECT_NAME: booking-e2e-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run E2E tests
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yaml down -v --remove-orphans || true
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yaml up --build --abort-on-container-exit --exit-code-from e2e-tests

      - name: Stop Docker containers
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yaml down -v --remove-orphans || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/public/playwright-report/
            frontend/public/test-results/